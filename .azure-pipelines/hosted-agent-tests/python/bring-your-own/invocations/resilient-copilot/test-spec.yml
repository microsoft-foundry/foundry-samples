version: 1

sample:
  owner: namantyagi
  experiences: [azd, vscode]

tests:
  - name: copilot-run-accepts-and-starts
    turns:
      - input:
          input: In one sentence, what is a hosted agent?
        assertions:
          # `azd ai agent invoke` captures the invocations ack / JSON snapshot
          # (the live Copilot progress is an SSE stream it does not subscribe
          # to). A healthy first request starts the resilient Copilot task and
          # reports the started/running lifecycle for this session's task id.
          - source: raw
            type: regex
            value: '"task_id"\s*:\s*"copilot-'
            min_matches: 1
          - source: raw
            type: regex
            value: '"status"\s*:\s*"(started|running|completed)"'
            min_matches: 1
