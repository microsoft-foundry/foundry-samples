version: 1

sample:
  owner: aochengwang
  experiences: [azd, vscode]

tests:
  - name: delegated-web-research
    turns:
      - input: Research how LangGraph checkpoints support multi-turn agents using delegated research. Include the exact primary-source URL https://docs.langchain.com/oss/python/langgraph/overview in both the saved report and your final reply. Save the cited report to /report-v1.md and give me its Blob URL and SHA256 for an Entra-authenticated download.
        assertions:
          - source: assistant_text
            type: contains
            value: https://docs.langchain.com/oss/python/langgraph/overview
          - source: raw
            type: regex
            value: '"name"\s*:\s*"task"'
          - source: raw
            type: regex
            value: '"name"\s*:\s*"publish_report"'
          - source: raw
            type: contains
            value: Microsoft Entra ID
          - source: raw
            type: regex
            value: '(?i)sig='
            min_matches: 0
            max_matches: 0
          - source: assistant_text
            type: regex
            value: 'https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s]+/report-v1\.md'
      - input: Read the saved /report-v1.md and wait for its contents. In a separate tool round, use write_file with that full unchanged report text as content to create /report-v2.md; do not create an empty file. After the copy succeeds, use edit_file to add a section headed 'Recovery Limitations' only to /report-v2.md while preserving its findings and citations. Do not repeat the research or modify /report-v1.md. Call publish_report with report_name='report-v2.md'. In your final reply, mention 'Recovery Limitations' and give me its unsigned Blob URL and SHA256 returned by that tool. Explain that downloading requires my own Microsoft Entra identity and Blob read permission. Do not construct a URL or issue a SAS.
        assertions:
          - source: assistant_text
            type: contains
            value: Recovery Limitations
          - source: raw
            type: regex
            value: '"name"\s*:\s*"edit_file"'
          - source: raw
            type: regex
            value: '"name"\s*:\s*"publish_report"'
          - source: raw
            type: contains
            value: Microsoft Entra ID
          - source: raw
            type: regex
            value: '(?i)sig='
            min_matches: 0
            max_matches: 0
          - source: assistant_text
            type: regex
            value: 'https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s]+/report-v2\.md'
      - input: Read both /report-v1.md and /report-v2.md using read_file, and confirm that only report-v2.md includes the added 'Recovery Limitations' section. Return the two existing Blob URLs and SHA256 digests labeled report-v1.md and report-v2.md. Do not edit the files or publish them again.
        assertions:
          - source: raw
            type: regex
            value: '"name"\s*:\s*"read_file"'
          - source: assistant_text
            type: contains
            value: report-v1.md
          - source: assistant_text
            type: contains
            value: report-v2.md
          - source: assistant_text
            type: regex
            value: 'https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s]+/report-v1\.md'
          - source: assistant_text
            type: regex
            value: 'https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s]+/report-v2\.md'
    assertions:
      - source: console_log
        type: contains
        value: Starting Deep Agents host with Entra-authenticated report downloads
      - source: console_log
        type: contains
        value: Published report report-v1.md
      - source: console_log
        type: contains
        value: Published report report-v2.md
      - source: console_log
        type: regex
        value: '(?i)(sig=|authorization: bearer)'
        min_matches: 0
        max_matches: 0
