version: 1

sample:
  owner: aochengwang
  experiences: [azd, vscode]

tests:
  - name: delegated-web-research
    turns:
      - input: Research how LangGraph checkpoints support multi-turn agents using delegated research. Include the exact primary-source URL https://docs.langchain.com/oss/python/langgraph/overview. Save the cited report to /final_report.md and give me its download link.
        assertions:
          - source: assistant_text
            type: contains
            value: https://docs.langchain.com/oss/python/langgraph/overview
          - source: raw
            type: regex
            value: '"name"\s*:\s*"task"'
          - source: raw
            type: regex
            value: '"name"\s*:\s*"publish_report"'
          - source: assistant_text
            type: regex
            value: 'https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s]+/final_report\.md\?[^\s]*sig='
      - input: Add a section headed 'Recovery Limitations' to the saved /final_report.md while preserving its findings and citations. Do not repeat the research. Give me a new download link for the updated report.
        assertions:
          - source: assistant_text
            type: contains
            value: Recovery Limitations
          - source: raw
            type: regex
            value: '"name"\s*:\s*"edit_file"'
          - source: raw
            type: regex
            value: '"name"\s*:\s*"publish_report"'
          - source: assistant_text
            type: regex
            value: 'https://[a-z0-9]+\.blob\.core\.windows\.net/[^\s]+/final_report\.md\?[^\s]*sig='
