version: 1

sample:
  owner: aochengwang
  experiences: [azd, vscode]

tests:
  - name: draft-awaits-human-review
    turns:
      - input: Draft a short announcement containing the exact marker GRAPH-HITL-REVIEW. Wait for human approval before finalizing it.
        assertions:
          - source: raw
            type: regex
            value: '"type"\s*:\s*"mcp_approval_request"'
          - source: raw
            type: contains
            value: GRAPH-HITL-REVIEW
  - name: approved-draft-is-emitted
    turns:
      - input: Draft a short announcement containing the exact marker GRAPH-HITL-APPROVED. Wait for human approval before finalizing it.
        approvals:
          mcp:
            - server_label: langgraph
              name: __hosted_agent_adapter_interrupt__
        assertions:
          - source: assistant_text
            type: contains
            value: GRAPH-HITL-APPROVED
