version: 1

# Behavior contract for the Claude + Foundry Toolbox (Responses) sample. The agent
# uses an existing Claude deployment and discovers/invokes tools from an existing
# toolbox over MCP via `FoundryToolbox`. The generic cloud E2E matrix does not
# provide a Claude deployment or account-scope Foundry User role, so this sample is
# excluded from that matrix until those prerequisites can be supplied safely.
#
# The turn asks a stable, historical factual question (rather than a "latest news"
# style prompt) so the expected answer never changes, while still requiring a real
# web search tool call to produce a cited source URL in the response.
sample:
  owner: zhuoqunli
  experiences: [azd, vscode]

tests:
  - name: web-search-cites-source
    when:
      toolbox_label: web-search
    turns:
      - input: "What year did Neil Armstrong become the first person to walk on the Moon? Search the web and cite a source URL."
        assertions:
          - source: raw
            type: regex
            value: '"type"\s*:\s*"function_call"\s*,'
          - source: raw
            type: regex
            value: '"type"\s*:\s*"function_call_output"'
          - source: assistant_text
            type: contains
            value: "1969"
          - source: assistant_text
            type: regex
            value: 'https?://'
          - source: assistant_text
            type: regex
            value: '(?i)traceback|unhandled exception'
            min_matches: 0
            max_matches: 0
