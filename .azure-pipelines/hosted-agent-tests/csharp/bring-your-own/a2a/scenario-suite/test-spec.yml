version: 1
sample:
  owner: hkunkanoor
  experiences: [azd]
# Native A2A requires scripts/Test-Suite.ps1. The shared planner does not
# support A2A; this is not a Responses contract or a CI bypass.
tests:
  - name: fixed-scenario-contract
    turns:
      - input: hello
        assertions:
          - source: assistant_text
            type: contains
            value: "Echo: hello"
    assertions:
      - source: console_log
        type: contains
        value: A2A_SUITE_CONFIG_VERIFIED
