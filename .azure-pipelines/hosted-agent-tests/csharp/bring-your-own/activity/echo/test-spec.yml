version: 1
sample:
  owner: hkunkanoor
  experiences: [azd, vscode]
tests:
  - name: echo-two-turns
    turns:
      - input: hello activity
        assertions:
          - source: assistant_text
            type: contains
            value: "Echo: hello activity"
      - input: second message
        assertions:
          - source: assistant_text
            type: contains
            value: "Echo: second message"
