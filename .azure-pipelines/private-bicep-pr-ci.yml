# Infrastructure template PR CI
# Builds Bicep templates and deploys changed samples into ephemeral resources.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - .azure-pipelines/private-bicep-pr-ci.yml
      - .azure-pipelines/scripts/bicep/**
      - samples/python/hosted-agents/bring-your-own/invocations/diagnostic-agent/**
      - infrastructure/infrastructure-setup-bicep/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - .azure-pipelines/private-bicep-pr-ci.yml
      - .azure-pipelines/scripts/bicep/**
      - samples/python/hosted-agents/bring-your-own/invocations/diagnostic-agent/**
      - infrastructure/infrastructure-setup-bicep/**

parameters:
  - name: validateAll
    displayName: Deploy all Bicep samples
    type: boolean
    default: false
  - name: samplePath
    displayName: Optional sample directory to deploy
    type: string
    default: ''

pool:
  vmImage: ubuntu-latest

variables:
  - group: foundry-samples-private-bicep-ci
  - name: BICEP_ROOT
    value: infrastructure/infrastructure-setup-bicep

stages:
  - stage: StaticValidation
    displayName: Static Bicep validation
    # ADO must also disable fork builds and restrict service-connection access.
    condition: |
      and(
        succeeded(),
        or(
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['System.PullRequest.IsFork'], 'False')
        )
      )
    jobs:
      - job: BuildBicep
        displayName: Build Bicep templates
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - bash: |
              set -euo pipefail

              az bicep install
              az bicep version

              if [ -n "${{ parameters.samplePath }}" ]; then
                sample_path="${{ parameters.samplePath }}"
                if [[ "$sample_path" != "$(BICEP_ROOT)"/* ]] || [ ! -d "$sample_path" ]; then
                  echo "##vso[task.logissue type=error]samplePath must be an existing directory under $(BICEP_ROOT)."
                  exit 1
                fi

                mapfile -t bicep_files < <(find "$sample_path" -name '*.bicep' -type f | sort)
              elif [ "${{ parameters.validateAll }}" = "true" ]; then
                mapfile -t bicep_files < <(find "$(BICEP_ROOT)" -name '*.bicep' -type f | sort)
              else
                if [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" ]; then
                  target_branch="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
                  git fetch origin "$target_branch"
                  base_ref="origin/$target_branch"
                else
                  base_ref="HEAD~1"
                fi

                mapfile -t changed_files < <(
                  git diff --name-only "$base_ref" HEAD -- "$(BICEP_ROOT)" | sort -u
                )

                declare -A build_dirs=()
                bicep_files=()
                for changed_file in "${changed_files[@]}"; do
                  if [[ "$changed_file" == *.bicep ]] && [ -f "$changed_file" ]; then
                    bicep_files+=("$changed_file")
                  fi

                  current_dir="$(dirname "$changed_file")"
                  while [ "$current_dir" != "." ] && [[ "$current_dir" == "$(BICEP_ROOT)"* ]]; do
                    if compgen -G "$current_dir/*.bicepparam" >/dev/null || [ -f "$current_dir/main.bicep" ]; then
                      build_dirs["$current_dir"]=1
                      break
                    fi
                    current_dir="$(dirname "$current_dir")"
                  done
                done

                for dir in "${!build_dirs[@]}"; do
                  while IFS= read -r file; do
                    bicep_files+=("$file")
                  done < <(find "$dir" -name '*.bicep' -type f | sort)
                done

                mapfile -t bicep_files < <(printf '%s\n' "${bicep_files[@]:-}" | sed '/^$/d' | sort -u)

                if [ "${#bicep_files[@]}" -eq 0 ] && git diff --quiet "$base_ref" HEAD -- .azure-pipelines/private-bicep-pr-ci.yml .azure-pipelines/scripts/bicep samples/python/hosted-agents/bring-your-own/invocations/diagnostic-agent; then
                  :
                elif [ "${#bicep_files[@]}" -eq 0 ]; then
                  echo "Pipeline or diagnostic tooling changed without template changes; building smoke sample."
                  bicep_files=("$(BICEP_ROOT)/00-basic/main.bicep")
                fi
              fi

              if [ "${#bicep_files[@]}" -eq 0 ]; then
                echo "No Bicep files found for this validation scope."
                exit 0
              fi

              for file in "${bicep_files[@]}"; do
                echo "Building $file"
                az bicep build --file "$file" --stdout >/dev/null
              done
            displayName: Build selected Bicep files

  - stage: AzureConnectionValidation
    displayName: Azure service connection validation
    dependsOn: StaticValidation
    jobs:
      - job: ValidateAzureLogin
        displayName: Validate Azure login
        steps:
          - task: AzureCLI@2
            displayName: Check Azure subscription access
            inputs:
              azureSubscription: infrastructure-template-validation
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az account show
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                actual="$(az account show --query id -o tsv)"
                test "$actual" = "$(AZURE_SUBSCRIPTION_ID)"
                az group list --query "[0].name" -o tsv

  - stage: LiveDeployment
    displayName: Ephemeral ARM deployment
    dependsOn: AzureConnectionValidation
    jobs:
      - job: DeployChangedBicepSamples
        displayName: Deploy changed Bicep samples
        timeoutInMinutes: 180
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: AzureCLI@2
            displayName: Deploy templates and clean up
            inputs:
              azureSubscription: infrastructure-template-validation
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"

                primary_location="$(CI_LOCATION)"
                fallback_location="$(CI_LOCATION_FALLBACK)"
                ci_model_name="${CI_MODEL_NAME:-gpt-5-mini}"
                ci_model_version="${CI_MODEL_VERSION:-2025-08-07}"
                rg_prefix="rg-template-ci-$(Build.BuildId)-$(System.JobAttempt)"
                deployment_prefix="template-ci-$(Build.BuildId)"
                cleanup_groups=()

                cleanup() {
                  for rg_name in "${cleanup_groups[@]:-}"; do
                    [ -n "$rg_name" ] || continue
                    echo "Scheduling cleanup for $rg_name"
                    az group delete --name "$rg_name" --yes --no-wait >/dev/null 2>&1 || true
                  done
                }
                trap cleanup EXIT

                if [ "$(Build.Reason)" = "PullRequest" ]; then
                  target_branch="${SYSTEM_PULLREQUEST_TARGETBRANCH:?Missing pull request target branch.}"
                  target_branch="${target_branch#refs/heads/}"
                  git fetch origin "$target_branch"
                  base_ref="origin/$target_branch"
                else
                  base_ref="HEAD~1"
                fi

                if [ -n "${{ parameters.samplePath }}" ]; then
                  sample_path="${{ parameters.samplePath }}"
                  if [[ "$sample_path" != "$(BICEP_ROOT)"/* ]] || [ ! -d "$sample_path" ]; then
                    echo "##vso[task.logissue type=error]samplePath must be an existing directory under $(BICEP_ROOT)."
                    exit 1
                  fi

                  if [ -f "$sample_path/main.bicepparam" ]; then
                    deployment_files=("$sample_path/main.bicepparam")
                  elif compgen -G "$sample_path/*.bicepparam" >/dev/null; then
                    mapfile -t deployment_files < <(find "$sample_path" -maxdepth 1 -name '*.bicepparam' -type f | sort)
                  elif [ -f "$sample_path/main.bicep" ]; then
                    deployment_files=("$sample_path/main.bicep")
                  else
                    echo "##vso[task.logissue type=error]samplePath does not contain a .bicepparam file or main.bicep."
                    exit 1
                  fi
                elif [ "${{ parameters.validateAll }}" = "true" ]; then
                  deployment_files=()
                  while IFS= read -r main_file; do
                    dir="$(dirname "$main_file")"
                    if compgen -G "$dir/*.bicepparam" >/dev/null; then
                      while IFS= read -r param_file; do
                        deployment_files+=("$param_file")
                      done < <(find "$dir" -maxdepth 1 -name '*.bicepparam' -type f | sort)
                    else
                      deployment_files+=("$main_file")
                    fi
                  done < <(find "$(BICEP_ROOT)" -mindepth 2 -maxdepth 2 -name 'main.bicep' -type f | sort)

                  mapfile -t deployment_files < <(printf '%s\n' "${deployment_files[@]:-}" | sed '/^$/d' | sort -u)
                else
                  mapfile -t changed_files < <(
                    git diff --name-only "$base_ref" HEAD -- "$(BICEP_ROOT)" | sort -u
                  )

                  declare -A deployable_dirs=()
                  for changed_file in "${changed_files[@]}"; do
                    [ -n "$changed_file" ] || continue
                    current_dir="$(dirname "$changed_file")"

                    while [ "$current_dir" != "." ] && [[ "$current_dir" == "$(BICEP_ROOT)"* ]]; do
                      if compgen -G "$current_dir/*.bicepparam" >/dev/null || [ -f "$current_dir/main.bicep" ]; then
                        deployable_dirs["$current_dir"]=1
                        break
                      fi
                      current_dir="$(dirname "$current_dir")"
                    done
                  done

                  deployment_files=()
                  for dir in "${!deployable_dirs[@]}"; do
                    if [ -f "$dir/main.bicepparam" ]; then
                      deployment_files+=("$dir/main.bicepparam")
                    elif compgen -G "$dir/*.bicepparam" >/dev/null; then
                      while IFS= read -r param_file; do
                        deployment_files+=("$param_file")
                      done < <(find "$dir" -maxdepth 1 -name '*.bicepparam' -type f | sort)
                    elif [ -f "$dir/main.bicep" ]; then
                      deployment_files+=("$dir/main.bicep")
                    fi
                  done

                  mapfile -t deployment_files < <(printf '%s\n' "${deployment_files[@]:-}" | sed '/^$/d' | sort -u)

                  if [ "${#deployment_files[@]}" -eq 0 ] && git diff --quiet "$base_ref" HEAD -- .azure-pipelines/private-bicep-pr-ci.yml .azure-pipelines/scripts/bicep samples/python/hosted-agents/bring-your-own/invocations/diagnostic-agent; then
                    :
                  elif [ "${#deployment_files[@]}" -eq 0 ]; then
                    echo "Pipeline or diagnostic tooling changed without template changes; deploying smoke sample."
                    deployment_files=("$(BICEP_ROOT)/00-basic/main.bicep")
                  fi
                fi

                if [ "${#deployment_files[@]}" -eq 0 ]; then
                  echo "No deployable Bicep samples found for the changed files. Static Bicep build already validated template syntax."
                  exit 0
                fi

                deploy_with_location() {
                  local deployment_file="$1"
                  local location="$2"
                  local deployment_slot="${3:-primary}"
                  local dir
                  local base
                  local extension
                  local template_file
                  local temp_param
                  local safe_name
                  local safe_base
                  local safe_location
                  local safe_slot
                  local deployment_hash
                  local unique_name
                  local unique_ai_prefix
                  local unique_key_vault_name
                  local unique_storage_name
                  local ci_key_version
                  local rg_name
                  local deployment_name

                  dir="$(dirname "$deployment_file")"
                  base="$(basename "$deployment_file")"
                  extension="${base##*.}"
                  template_file="$deployment_file"
                  temp_param="$dir/.ci.$base"
                  safe_name="$(basename "$dir" | tr -cd '[:alnum:]-' | cut -c1-24)"
                  safe_base="$(basename "$base" ".$extension" | tr -cd '[:alnum:]-' | cut -c1-16)"
                  safe_location="$(printf '%s' "$location" | tr -cd '[:alnum:]' | cut -c1-8)"
                  safe_slot="$(printf '%s' "$deployment_slot" | tr -cd '[:alnum:]' | cut -c1-1)"
                  deployment_hash="$(printf '%s:%s' "$deployment_file" "$safe_slot" | sha256sum | cut -c1-6)"
                  unique_name="$(printf 'fsci%s%s%s%s%s%s' "$(Build.BuildId)" "$(System.JobAttempt)" "$deployment_hash" "$safe_location" "$safe_slot" "$safe_name" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-' | cut -c1-37)"
                  unique_ai_prefix="$(printf 'fs%s%s%s' "$(Build.BuildId)" "$(System.JobAttempt)" "$deployment_hash" | tr -cd '[:alnum:]' | cut -c1-13)"
                  unique_key_vault_name="$(printf 'fsci%s%s%s%s%s%s' "$(Build.BuildId)" "$(System.JobAttempt)" "$deployment_hash" "$safe_location" "$safe_slot" "$safe_name" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-' | cut -c1-24)"
                  unique_storage_name="$(printf 'fsci%s%s%s%s%s%s' "$(Build.BuildId)" "$(System.JobAttempt)" "$deployment_hash" "$safe_location" "$safe_slot" "$safe_name" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]' | cut -c1-24)"
                  rg_name="$rg_prefix-$safe_location-$deployment_hash-$safe_slot-$safe_name-$safe_base"
                  deployment_name="$deployment_prefix-$deployment_hash-$safe_slot-$safe_name"
                  ci_key_version=""

                  template_declares_param() {
                    local param_name="$1"
                    grep -qE "^param[[:space:]]+$param_name[[:space:]]+" "$template_file"
                  }

                  add_parameter_override() {
                    local param_name="$1"
                    local param_value="$2"

                    if ! template_declares_param "$param_name"; then
                      return
                    fi

                    if [ "$extension" = "bicepparam" ]; then
                      if grep -qE "^param[[:space:]]+$param_name[[:space:]]*=" "$temp_param"; then
                        sed -i -E "s|^param[[:space:]]+$param_name[[:space:]]*=.*|param $param_name = '$param_value'|" "$temp_param"
                      else
                        printf "\nparam %s = '%s'\n" "$param_name" "$param_value" >> "$temp_param"
                      fi
                    else
                      deployment_args+=(--parameters "$param_name=$param_value")
                    fi
                  }

                  prepare_ci_key_version() {
                    if ! template_declares_param keyVersion || ! template_declares_param keyVaultName; then
                      return
                    fi

                    echo "Creating CI Key Vault key for $deployment_file"
                    az keyvault create \
                      --name "$unique_key_vault_name" \
                      --resource-group "$rg_name" \
                      --location "$location" \
                      --enable-rbac-authorization false \
                      --public-network-access Enabled \
                      --retention-days 7 \
                      --only-show-errors >/dev/null

                    ci_key_uri="$(az keyvault key create \
                      --vault-name "$unique_key_vault_name" \
                      --name key \
                      --kty RSA \
                      --size 2048 \
                      --ops encrypt decrypt sign verify wrapKey unwrapKey \
                      --query 'key.kid' -o tsv)"
                    ci_key_version="${ci_key_uri##*/}"

                    if [ -z "$ci_key_version" ]; then
                      echo "##vso[task.logissue type=error]Could not resolve CI Key Vault key version for $unique_key_vault_name."
                      return 1
                    fi
                  }

                  echo "Creating resource group $rg_name in $location"
                  az group create \
                    --name "$rg_name" \
                    --location "$location" \
                    --tags purpose=template-deployment-validation buildId="$(Build.BuildId)" sample="$safe_name" || return 1
                  cleanup_groups+=("$rg_name")

                  echo "Deploying $deployment_file to $rg_name"
                  if [ "$extension" = "bicepparam" ]; then
                    if grep -qE '^param[[:space:]]+location[[:space:]]*=' "$deployment_file"; then
                      sed -E "s|^param[[:space:]]+location[[:space:]]*=.*|param location = '$location'|" "$deployment_file" > "$temp_param"
                    else
                      cp "$deployment_file" "$temp_param"
                    fi

                    using_path="$(sed -nE "s|^using[[:space:]]+'(.+)'[[:space:]]*$|\1|p" "$deployment_file" | head -n 1)"
                    if [ -n "$using_path" ]; then
                      template_file="$dir/${using_path#./}"
                    fi

                    prepare_ci_key_version || return 1

                    add_parameter_override aiFoundryName "$unique_name"
                    add_parameter_override aiServices "$unique_ai_prefix"
                    add_parameter_override aiServicesName "$unique_name"
                    add_parameter_override accountName "$unique_name"
                    add_parameter_override apimName "apim-$unique_storage_name"
                    add_parameter_override backendAccountName "$unique_name-backend"
                    add_parameter_override customDNSName "$unique_name-alt"
                    add_parameter_override storageAccountName "$unique_storage_name"
                    add_parameter_override azureStorageName "$unique_storage_name"
                    add_parameter_override keyVaultName "$unique_key_vault_name"
                    add_parameter_override keyName key
                    add_parameter_override keyVersion "$ci_key_version"
                    add_parameter_override modelName "$ci_model_name"
                    add_parameter_override modelVersion "$ci_model_version"

                    az deployment group create \
                      --resource-group "$rg_name" \
                      --name "$deployment_name" \
                      --parameters "$temp_param" || return 1
                    rm -f "$temp_param"
                  else
                    deployment_args=(
                      --resource-group "$rg_name"
                      --name "$deployment_name"
                      --template-file "$deployment_file"
                    )

                    if grep -qE '^param[[:space:]]+location[[:space:]]+' "$deployment_file"; then
                      deployment_args+=(--parameters location="$location")
                    fi

                    prepare_ci_key_version || return 1

                    add_parameter_override aiFoundryName "$unique_name"
                    add_parameter_override aiServices "$unique_ai_prefix"
                    add_parameter_override aiServicesName "$unique_name"
                    add_parameter_override accountName "$unique_name"
                    add_parameter_override apimName "apim-$unique_storage_name"
                    add_parameter_override backendAccountName "$unique_name-backend"
                    add_parameter_override customDNSName "$unique_name-alt"
                    add_parameter_override storageAccountName "$unique_storage_name"
                    add_parameter_override azureStorageName "$unique_storage_name"
                    add_parameter_override keyVaultName "$unique_key_vault_name"
                    add_parameter_override keyName key
                    add_parameter_override keyVersion "$ci_key_version"
                    add_parameter_override modelName "$ci_model_name"
                    add_parameter_override modelVersion "$ci_model_version"

                    az deployment group create "${deployment_args[@]}" || return 1
                  fi

                  provisioning_state="$(az deployment group show \
                    --resource-group "$rg_name" \
                    --name "$deployment_name" \
                    --query properties.provisioningState -o tsv)" || return 1
                  if [ "$provisioning_state" != "Succeeded" ]; then
                    echo "##vso[task.logissue type=error]Deployment $deployment_name provisioningState=$provisioning_state."
                    az deployment group show \
                      --resource-group "$rg_name" \
                      --name "$deployment_name" \
                      --query properties.error -o json || true
                    return 1
                  fi

                  resource_count="$(az resource list --resource-group "$rg_name" --query 'length(@)' -o tsv)" || return 1
                  if [ "$resource_count" -lt 1 ]; then
                    echo "##vso[task.logissue type=error]Deployment $deployment_name completed but no resources were found in $rg_name."
                    return 1
                  fi

                  echo "Deployment $deployment_name succeeded and created $resource_count resource(s)."

                  if ! AZURE_SUBSCRIPTION_ID="$(AZURE_SUBSCRIPTION_ID)" \
                      DIAGNOSTIC_FALLBACK_LOCATION="$fallback_location" \
                      bash .azure-pipelines/scripts/bicep/run-data-plane-diagnostics.sh \
                      "$rg_name" \
                      "$location" \
                      "$deployment_file"; then
                    echo "##vso[task.logissue type=error]Data-plane diagnostics failed for $deployment_name."
                    exit 1
                  fi
                  echo "Data-plane diagnostics completed for $deployment_name."
                }

                bicepparam_supports_location() {
                  local deployment_file="$1"
                  local location="$2"
                  local dir
                  local base
                  local extension
                  local temp_param
                  local temp_output

                  dir="$(dirname "$deployment_file")"
                  base="$(basename "$deployment_file")"
                  extension="${base##*.}"

                  if [ "$extension" != "bicepparam" ]; then
                    return 0
                  fi

                  temp_param="$dir/.ci.location-check.$base"
                  temp_output="$dir/.ci.location-check.$base.json"

                  if grep -qE '^param[[:space:]]+location[[:space:]]*=' "$deployment_file"; then
                    sed -E "s|^param[[:space:]]+location[[:space:]]*=.*|param location = '$location'|" "$deployment_file" > "$temp_param"
                  else
                    cp "$deployment_file" "$temp_param"
                  fi

                  if az bicep build-params --file "$temp_param" --outfile "$temp_output" --only-show-errors; then
                    rm -f "$temp_param" "$temp_output"
                    return 0
                  fi

                  rm -f "$temp_param" "$temp_output"
                  return 1
                }

                for deployment_file in "${deployment_files[@]}"; do
                  echo "Deploying $deployment_file in $primary_location"
                  if deploy_with_location "$deployment_file" "$primary_location" "primary"; then
                    continue
                  fi

                  echo "##vso[task.logissue type=error]Deployment failed in $primary_location for $deployment_file."
                  echo "Retrying in $fallback_location to collect fallback-region validation evidence."
                  if bicepparam_supports_location "$deployment_file" "$fallback_location"; then
                    deploy_with_location "$deployment_file" "$fallback_location" "fallback" || true
                  else
                    echo "##vso[task.logissue type=warning]Skipping fallback deployment because $deployment_file does not allow location '$fallback_location'."
                  fi
                  exit 1
                done
