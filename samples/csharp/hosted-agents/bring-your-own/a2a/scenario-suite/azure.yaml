# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.34.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'
name: a2a-dotnet-scenarios
services:
  ai-project:
    host: azure.ai.project
  a2a-dotnet-s01-echo: &scenario
    host: azure.ai.agent
    project: src/ScenarioAgents
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: ScenarioAgents.dll
      dependencyResolution: bundled
    uses: [ai-project]
    kind: hosted
    name: a2a-dotnet-s01-echo
    displayName: ".NET A2A 01 - Getting started"
    description: Fixed deterministic scenario built directly from the compiled .NET SDK samples.
    protocols:
      - protocol: a2a
        version: 1.0.0
    env:
      A2A_SUITE_SCENARIO: '1'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    agentEndpoint:
      # Responses is required by the current public Agent Card gateway.
      # Only scenario 10 additionally installs an Invocations handler.
      protocols: [a2a, responses]
    agentCard:
      description: Fixed deterministic .NET A2A SDK sample scenario.
      version: 1.0.0
      skills:
        - id: sample-scenario
          name: SDK sample scenario
          description: Exercises the fixed sample selected at deployment.
          tags: [a2a, dotnet, sample]
          examples: [hello]
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  a2a-dotnet-s02-tasks:
    <<: *scenario
    name: a2a-dotnet-s02-tasks
    displayName: ".NET A2A 02 - Tasks and artifacts"
    env:
      A2A_SUITE_SCENARIO: '2'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s03-streaming:
    <<: *scenario
    name: a2a-dotnet-s03-streaming
    displayName: ".NET A2A 03 - Streaming"
    env:
      A2A_SUITE_SCENARIO: '3'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s04-multiturn:
    <<: *scenario
    name: a2a-dotnet-s04-multiturn
    displayName: ".NET A2A 04 - Multi-turn"
    env:
      A2A_SUITE_SCENARIO: '4'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s05-longrunning:
    <<: *scenario
    name: a2a-dotnet-s05-longrunning
    displayName: ".NET A2A 05 - Long-running tasks"
    env:
      A2A_SUITE_SCENARIO: '5'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s06-custombuild:
    <<: *scenario
    name: a2a-dotnet-s06-custombuild
    displayName: ".NET A2A 06 - Customize the build"
    env:
      A2A_SUITE_SCENARIO: '6'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s07-handler:
    <<: *scenario
    name: a2a-dotnet-s07-handler
    displayName: ".NET A2A 07 - Existing request handler"
    env:
      A2A_SUITE_SCENARIO: '7'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s08-native:
    <<: *scenario
    name: a2a-dotnet-s08-native
    displayName: ".NET A2A 08 - Native hosting"
    env:
      A2A_SUITE_SCENARIO: '8'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s09-tier1:
    <<: *scenario
    name: a2a-dotnet-s09-tier1
    displayName: ".NET A2A 09 - Tier 1 callback"
    env:
      A2A_SUITE_SCENARIO: '9'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s10-tier2:
    <<: *scenario
    name: a2a-dotnet-s10-tier2
    displayName: ".NET A2A 10 - Tier 2 multi-protocol"
    protocols:
      - protocol: a2a
        version: 1.0.0
      - protocol: invocations
        version: 2.0.0
    agentEndpoint:
      protocols: [a2a, responses, invocations]
    env:
      A2A_SUITE_SCENARIO: '10'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s11-tier3:
    <<: *scenario
    name: a2a-dotnet-s11-tier3
    displayName: ".NET A2A 11 - Tier 3 self-hosting"
    env:
      A2A_SUITE_SCENARIO: '11'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
  a2a-dotnet-s12-persistence:
    <<: *scenario
    name: a2a-dotnet-s12-persistence
    displayName: ".NET A2A 12 - Durable task persistence"
    env:
      A2A_SUITE_SCENARIO: '12'
      A2A_SUITE_SOURCE_SHA: ${A2A_SUITE_SOURCE_SHA}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
infra:
  provider: microsoft.foundry
