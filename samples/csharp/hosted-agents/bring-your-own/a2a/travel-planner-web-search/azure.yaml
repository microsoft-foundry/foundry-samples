# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: a2a-travel-web-search-dotnet
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 100
  flights:
    host: azure.ai.agent
    project: src/TravelAgents
    language: csharp
    kind: hosted
    name: travel-web-flights-dotnet
    uses: [ai-project]
    codeConfiguration: {runtime: dotnet_10, entryPoint: TravelAgents.dll, dependencyResolution: bundled}
    protocols: [{protocol: a2a, version: 1.0.0}]
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Flight specialist returning cited, unverified web travel research.
      version: 1.0.0
      skills:
        - id: flights
          name: Flight Agent
          description: Research public route, dates, arrival deadline, travelers, USD budget and refundability.
          tags: [web-travel-research, flights]
    env:
      AGENT_ROLE: flights
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '1', memory: 2Gi}
  hotels:
    host: azure.ai.agent
    project: src/TravelAgents
    language: csharp
    kind: hosted
    name: travel-web-hotels-dotnet
    uses: [ai-project]
    codeConfiguration: {runtime: dotnet_10, entryPoint: TravelAgents.dll, dependencyResolution: bundled}
    protocols: [{protocol: a2a, version: 1.0.0}]
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Hotel specialist returning cited, unverified web travel research.
      version: 1.0.0
      skills:
        - id: hotels
          name: Hotel Agent
          description: Research stay dates, travelers, public office landmark, distance, budget and refundability.
          tags: [web-travel-research, hotels]
    env:
      AGENT_ROLE: hotels
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '1', memory: 2Gi}
  planner:
    host: azure.ai.agent
    project: src/TravelAgents
    language: csharp
    kind: hosted
    name: travel-web-planner-dotnet
    uses: [ai-project]
    codeConfiguration: {runtime: dotnet_10, entryPoint: TravelAgents.dll, dependencyResolution: bundled}
    protocols: [{protocol: a2a, version: 1.0.0}]
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Card-discovered A2A delegation and versioned, user-isolated trip research.
      version: 1.0.0
      skills:
        - id: planner
          name: Travel Planner
          description: Create, read and revise saved trips. Research is unverified, not booking.
          tags: [web-travel-research, a2a]
    env:
      AGENT_ROLE: planner
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      FLIGHT_AGENT_ENDPOINT: ${FLIGHT_AGENT_ENDPOINT}
      HOTEL_AGENT_ENDPOINT: ${HOTEL_AGENT_ENDPOINT}
      TRAVEL_PLAN_STORE_NAME: travel-web-research-dotnet
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '1', memory: 2Gi}
infra:
  provider: microsoft.foundry
