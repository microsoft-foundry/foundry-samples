# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: echo-a2a-dotnet
services:
  ai-project:
    host: azure.ai.project
  echo-a2a-dotnet:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - A2A Protocol
        - Bring Your Own
        - .NET
    project: src/echo-a2a-dotnet
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: EchoA2A.dll
      dependencyResolution: bundled
    uses:
      - ai-project
    kind: hosted
    name: echo-a2a-dotnet
    displayName: Echo (.NET, A2A)
    description: Deterministic native A2A v1 Echo with explicit incremental artifact streaming. Uses the locally built Agent Server A2A library; no model is required.
    protocols:
      - protocol: a2a
        version: 1.0.0
    env:
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    agentEndpoint:
      protocols:
        - a2a
        # Required by the current Foundry Agent Card gateway; no Responses handler is installed.
        - responses
    agentCard:
      description: Echoes text as a completed native A2A Task artifact.
      version: 1.0.0
      skills:
        - id: echo
          name: Echo
          description: Returns the supplied text with an Echo prefix.
          tags:
            - echo
          examples:
            - hello
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
