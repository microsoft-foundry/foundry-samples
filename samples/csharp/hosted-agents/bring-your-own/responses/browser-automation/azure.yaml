# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: bat-csharp-byo
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-6-sol
        model:
          format: OpenAI
          name: gpt-6-sol
          version: '2026-09-22'
        sku:
          name: GlobalStandard
          capacity: 10
  bat-csharp-byo:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - Browser Automation
        - .NET
    project: src/bat-csharp-byo
    language: csharp
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: bat-csharp-byo
    displayName: Browser Automation Agent (C#, BYO Responses)
    description: A Foundry-hosted browser automation agent (C#, BYO Responses) for general browsing, web scraping, and form filling.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-6-sol}
      TOOLBOX_NAME: browser-automation-tools
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: hooks/postprovision.ps1
      interactive: true
    posix:
      shell: sh
      run: hooks/postprovision.sh
      interactive: true
  postdeploy:
    windows:
      shell: pwsh
      run: hooks/postdeploy.ps1
    posix:
      shell: sh
      run: hooks/postdeploy.sh
