# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: github-copilot-dotnet-activity
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 20
  github-copilot-dotnet-activity:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Activity Protocol
        - Bring Your Own
        - GitHub Copilot SDK
        - .NET
    project: src/github-copilot-dotnet-activity
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: github-copilot.dll
    uses:
      - ai-project
    kind: hosted
    name: github-copilot-dotnet-activity
    displayName: GitHub Copilot (.NET, Activity)
    description: >
      A C# personal assistant using the GitHub Copilot SDK with a Foundry
      model, streaming replies, a persistent to-do list, Adaptive Cards,
      shared-file reading, and Teams file-consent downloads.
      Hosted by Azure.AI.AgentServer.Activity.
    protocols:
      - protocol: activity
        version: 2.0.0
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5-mini}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
