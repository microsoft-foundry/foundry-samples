# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: harness-scaling-capabilities-dotnet
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  harness-scaling-capabilities-dotnet:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Agent Framework
        - Harness Agent
    project: src/harness-scaling-capabilities
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: harness-scaling-capabilities.dll
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: harness-scaling-capabilities-dotnet
    displayName: Harness Scaling Capabilities (.NET, Agent Framework)
    description: A personal-finance harness agent with file skills, a confined shell, CodeAct, and fan-out background research, hosted via the Responses protocol with the Agent Framework in C#.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
