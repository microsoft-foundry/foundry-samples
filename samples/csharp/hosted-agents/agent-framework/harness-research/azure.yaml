# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.16'
name: harness-research
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 60
                name: GlobalStandard
    harness-research:
        project: src/harness-research
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: harness-research.dll
            runtime: dotnet_10
        docker:
            path: Dockerfile
            remoteBuild: true
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Agent Framework harness agent that plans and executes research tasks using AsHarnessAgent, demonstrating the built-in TodoProvider, AgentModeProvider (plan/execute), FileMemoryProvider, tool approval, and a loop evaluator that re-invokes the agent until all todos complete.
        displayName: Harness Research Agent
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Agent Framework
                - Harness Agent
        name: harness-research
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
