# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: azure-search-rag
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  azure-search-rag:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Agent Framework
        - RAG
        - Azure AI Search
    project: src/azure-search-rag
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: azure-search-rag.dll
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: azure-search-rag
    displayName: Azure AI Search RAG Agent
    description: A support specialist agent with Retrieval Augmented Generation (RAG) backed by Azure AI Search. Uses TextSearchProvider over a real SearchClient to ground answers in Contoso Outdoors product documentation indexed in Azure AI Search.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_SEARCH_ENDPOINT: https://${AZURE_AI_SEARCH_SERVICE_NAME}.search.windows.net
      AZURE_SEARCH_INDEX_NAME: contoso-outdoors
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
