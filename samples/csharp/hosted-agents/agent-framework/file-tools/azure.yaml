# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: file-tools
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  file-tools:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Agent Framework
        - File Tools
    project: src/file-tools
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: file-tools.dll
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: file-tools
    displayName: File Tools Agent
    description: 'A hosted agent that answers questions over two file knowledge sources: image-bundled reference files and per-session uploaded files. Demonstrates security-scoped tool pairs (one tool per source, no path-typed parameters).'
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
