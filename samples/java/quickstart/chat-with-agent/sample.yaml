name: Quickstart Chat with Agent
description: Basic quickstart sample demonstrating Microsoft Foundry chat with Agent.

build: "mvn compile"
validate: "mvn compile"
live_service_validation:
  command: "mvn compile exec:java -Dexec.mainClass=com.azure.ai.foundry.samples.ChatWithAgent"
  required_env:
    - FOUNDRY_PROJECT_ENDPOINT
    - MODEL_DEPLOYMENT
  cleanup_resources:
    - type: foundry_agent_versions
  substitutions:
    - file: src/main/java/com/azure/ai/foundry/samples/ChatWithAgent.java
      replacements:
        - placeholder: "your_project_endpoint"
          env: FOUNDRY_PROJECT_ENDPOINT
        - placeholder: "your-agent-name"
          generate: unique_name
        - placeholder: "gpt-5-mini"
          env: MODEL_DEPLOYMENT
