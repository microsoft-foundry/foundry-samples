name: Quickstart Responses
description: Basic quickstart sample demonstrating Microsoft Foundry responses.

build: "npm install --registry=https://registry.npmjs.org/"
validate: "npx tsc --noEmit"
live_service_validation:
  command: "npm run start"
  required_env:
    - FOUNDRY_PROJECT_ENDPOINT
    - MODEL_DEPLOYMENT
  substitutions:
    - file: src/quickstart-responses.ts
      replacements:
        - placeholder: "your_project_endpoint"
          env: FOUNDRY_PROJECT_ENDPOINT
        - placeholder: "gpt-5-mini"
          env: MODEL_DEPLOYMENT
