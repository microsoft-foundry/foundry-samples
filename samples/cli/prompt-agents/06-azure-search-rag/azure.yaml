# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: prompt-agent-azure-ai-search
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  aisearch-conn:
    host: azure.ai.connection
    uses:
      - ai-project
    category: CognitiveSearch
    target: ${AZURE_SEARCH_ENDPOINT}
    authType: AAD
  prompt-agent-azure-ai-search:
    host: azure.ai.agent
    project: .
    uses:
      - ai-project
      - aisearch-conn
    kind: prompt
    name: prompt-agent-azure-ai-search
    description: A prompt agent that grounds answers in an Azure AI Search index.
    model: gpt-5.4-mini
    instructions: >-
      You are a product support assistant. Use the Azure AI Search tool to ground your answers in
      the product knowledge base. If the answer is not in the index, say you do not have that
      information.
    toolChoice: auto
    tools:
      - type: azure_ai_search
        name: knowledge-base
        description: Search the product knowledge base index.
        azure_ai_search:
          indexes:
            - index_name: ${AZURE_SEARCH_INDEX_NAME}
              project_connection_id: aisearch-conn
infra:
  provider: microsoft.foundry
