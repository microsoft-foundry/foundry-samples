# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: prompt-agent-basic
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  prompt-agent-basic:
    host: azure.ai.agent
    project: .
    uses:
      - ai-project
    kind: prompt
    name: prompt-agent-basic
    description: A basic prompt agent.
    model: gpt-5.4-mini
    instructions: You are a helpful, friendly assistant. Answer questions clearly and concisely.
infra:
  provider: microsoft.foundry
