# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.36.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.21'
    azure.ai.projects: '>=1.0.0-beta.14'
    azure.ai.skills: '>=1.0.0-beta.8'

name: prompt-agent-skills
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 30
  travel-guide:
    host: azure.ai.skill
    uses:
      - ai-project
    archive: ./skills/travel-guide
  prompt-agent-skills:
    host: azure.ai.agent
    project: .
    uses:
      - ai-project
      - travel-guide
    kind: prompt
    name: prompt-agent-skills
    description: A prompt agent backed by a file-based skill.
    harness:
      type: microsoft_copilot_preview
    model: gpt-5.4-mini
    instructions: >-
      You are a helpful travel assistant. Use the travel-guide skill whenever the user asks for a
      city travel guide, itinerary, or trip plan.
infra:
  provider: microsoft.foundry
