# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.36.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.21'
    azure.ai.projects: '>=1.0.0-beta.14'
    azure.ai.toolboxes: '>=1.0.0-beta.11'

name: prompt-agent-with-toolbox
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 30
  sample-toolbox:
    host: azure.ai.toolbox
    uses:
      - ai-project
    description: A curated toolbox with built-in web search.
    tools:
      - type: web_search
  prompt-agent-with-toolbox:
    host: azure.ai.agent
    project: .
    uses:
      - ai-project
      - sample-toolbox
    kind: prompt
    name: prompt-agent-with-toolbox
    description: A prompt agent that uses a curated Foundry Toolbox.
    harness:
      type: microsoft_copilot_preview
    model: gpt-5.4-mini
    instructions: >-
      You are a helpful assistant with access to a curated Foundry Toolbox. Use the toolbox search
      tool to find the right tool for the user's request, then call it.
    tools:
      - type: microsoft_copilot_toolset_preview
        defaultConfig:
          enabled: false
      - type: mcp
        server_label: sample-toolbox
        require_approval: never
    toolboxes:
      - sample-toolbox
infra:
  provider: microsoft.foundry
