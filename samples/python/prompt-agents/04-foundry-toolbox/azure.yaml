# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: prompt-agent-toolbox
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  sample-toolbox:
    host: azure.ai.toolbox
    uses:
      - ai-project
    description: A curated toolbox with built-in web search.
    tools:
      - type: web_search
  prompt-agent-toolbox:
    host: azure.ai.agent
    project: .
    uses:
      - ai-project
      - sample-toolbox
    kind: prompt
    name: prompt-agent-toolbox
    description: A prompt agent that uses a curated Foundry Toolbox.
    harness:
      type: github_copilot_preview
    model: gpt-5.4-mini
    instructions: >-
      You are a helpful assistant with access to a curated Foundry Toolbox. Use the toolbox search
      tool to find the right tool for the user's request, then call it.
    toolbox:
      name: sample-toolbox
infra:
  provider: microsoft.foundry
