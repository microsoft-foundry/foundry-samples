[project]
name = "toolbox-autopilot"
version = "0.1.0"
description = "Microsoft 365 Autopilot that consumes tools from a Foundry Toolbox."
authors = [{ name = "Microsoft", email = "support@microsoft.com" }]
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry==1.12.0",
    "agent-framework-foundry-hosting==1.0.0b260821",
    "aiohttp==3.14.3",
    "azure-ai-agentserver-activity==1.0.0b3",
    "azure-ai-agentserver-core==2.2.0b1",
    "azure-ai-projects==2.3.0",
    "azure-identity==1.25.3",
    "microsoft-agents-activity==1.4.0",
    "microsoft-agents-hosting-core==1.4.0",
]

[project.scripts]
agent = "agent.__main__:main"

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
