# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.31.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: hello-world-autopilot
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/prepare-provision.ps1
    interactive: true
services:
  hello-world-autopilot:
    host: azure.ai.agent
    metadata:
      tags:
        - Autopilot
        - Activity Protocol
        - Microsoft 365
        - Python
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    kind: hosted
    name: hello-world-autopilot
    displayName: Hello World Autopilot
    description: >
      Minimal Microsoft 365 Autopilot agent that responds to Teams messages.
    protocols:
      - protocol: activity
        version: 2.0.0
    activity:
      useCase: digital_worker
      publish:
        publishScope: tenant
        canRespondWithoutMention: true
        appVersion: 1.0.0
        agentDisplayName: Hello World Autopilot
        shortDescription: A minimal Microsoft 365 Autopilot agent.
        fullDescription: >
          A Microsoft Foundry agent that responds to Teams messages.
        developerName: Microsoft
        developerWebsiteUrl: https://www.microsoft.com
        privacyUrl: https://privacy.microsoft.com
        termsOfUseUrl: https://www.microsoft.com/legal/terms-of-use
        agenticUserTemplate:
          id: digitalWorkerTemplate
          file: agenticUserTemplateManifest.json
          schemaVersion: 0.1.0-preview
          communicationProtocol: activityProtocol
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: ENABLE_OBSERVABILITY
        value: "true"
      - name: ENABLE_A365_OBSERVABILITY_EXPORTER
        value: "true"
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: bicep
  path: infra
  module: main
