[project]
name = "foundry-toolbox-autopilot"
version = "0.1.0"
description = "A Teams Autopilot using one Foundry Toolbox for Microsoft Learn and Bing-backed public web search."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry==1.14.0",
    "agent-framework-foundry-hosting==1.0.0b261002",
    "azure-ai-agentserver-activity==1.0.0b3",
    "azure-ai-agentserver-core==2.2.0",
    "azure-identity==1.25.3",
    "microsoft-agents-hosting-core==1.4.0",
    "microsoft-agents-activity==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
