# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
    azure.ai.toolboxes: '>=1.0.0-beta.9'
name: foundry-toolbox-autopilot
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/prepare-provision.ps1
    interactive: true
services:
  foundry-toolbox-autopilot:
    host: azure.ai.agent
    metadata:
      tags:
        - Autopilot
        - Foundry Toolbox
        - Web Search
        - Agent Framework
        - Activity Protocol
        - Microsoft 365
        - Python
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    kind: hosted
    name: foundry-toolbox-autopilot
    displayName: Foundry Toolbox Autopilot
    description: >
      Uses one Foundry Toolbox for Microsoft Learn and Bing-backed public web search.
    protocols:
      - protocol: activity
        version: 2.0.0
    activity:
      digitalWorkerType: m365
      publish:
        publishScope: tenant
        canRespondWithoutMention: true
        appVersion: 1.0.0
        agentDisplayName: Foundry Toolbox Autopilot
        shortDescription: Find Microsoft docs and search the public web.
        fullDescription: >
          A Microsoft Foundry Autopilot that uses Agent Framework and a Foundry
          Toolbox to find Microsoft documentation and current public web
          information through Bing-backed Foundry Web Search. Both sources
          are read-only and require no downstream user credentials.
        developerName: Microsoft
        developerWebsiteUrl: https://www.microsoft.com
        privacyUrl: https://privacy.microsoft.com
        termsOfUseUrl: https://www.microsoft.com/legal/terms-of-use
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      FOUNDRY_AGENT365_TRACING_ENABLED: "true"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: bicep
  path: infra
  module: main
