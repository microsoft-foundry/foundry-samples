[project]
name = "meeting-assistant-autopilot"
version = "0.1.0"
description = "Preview meeting agenda reminders and transcript-grounded agenda closure."
requires-python = ">=3.11"
dependencies = [
    "azure-ai-agentserver-activity==1.0.0b3",
    "azure-ai-agentserver-core==2.2.0b1",
    "azure-ai-projects==2.5.0",
    "azure-identity==1.25.3",
    "microsoft-agents-hosting-core==1.9.0.dev0",
    "microsoft-agents-hosting-msteams==1.9.0.dev0",
    "microsoft-agents-activity==1.9.0.dev0",
    "microsoft-agents-authentication-msal==1.9.0.dev0",
    "microsoft-teams-api==2.1.0",
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "mcp==1.30.0",
    "openai==3.0.0",
    "pydantic==2.13.4",
    "starlette==1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
