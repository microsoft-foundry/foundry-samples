# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.34.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.19'
name: optimization-travel-approver-python-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
      - name: gpt-5.4
        model:
          format: OpenAI
          name: gpt-5.4
          version: '2025-04-14'
        sku:
          name: GlobalStandard
          capacity: 10
  optimization-travel-approver-python-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Agent Framework
        - Python
        - Agent Optimization
        - Travel Approval
    project: src/optimization-travel-approver-python-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: optimization-travel-approver-python-responses
    displayName: Optimization Travel Approver (Python, Agent Framework)
    description: Travel request approval agent using Agent Framework with agent optimizer support. Demonstrates tool, skill, and instruction optimization with a realistic business scenario.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OPTIMIZATION_LOCAL_DIR: .agent_configs
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
