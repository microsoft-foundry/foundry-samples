# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-foundry-toolbox-mcp-skills-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent-framework-agent-foundry-toolbox-mcp-skills-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Agent Skills
        - MCP
        - Foundry Toolbox
        - Foundry Toolbox Skills
    project: src/agent-framework-agent-foundry-toolbox-mcp-skills-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-foundry-toolbox-mcp-skills-responses
    displayName: Foundry Toolbox - MCP Skills Agent
    description: A self-contained Agent Framework agent that discovers MCP-based skills from a Foundry Toolbox and exposes them to the agent via a skills provider with progressive disclosure (advertise, load). Ships bundled SKILL.md sources and a toolbox.yaml.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT:-}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
hooks:
  postprovision:
    posix:
      shell: sh
      run: src/agent-framework-agent-foundry-toolbox-mcp-skills-responses/hooks/postprovision.sh
      interactive: true
    windows:
      shell: pwsh
      run: src/agent-framework-agent-foundry-toolbox-mcp-skills-responses/hooks/postprovision.ps1
      interactive: true
infra:
  provider: microsoft.foundry
