# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-egress-control-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1
        model:
          format: OpenAI
          name: gpt-4.1
          version: '2025-04-14'
        sku:
          name: GlobalStandard
          capacity: 10
  agent-framework-egress-control-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Egress Control
        - Network Isolation
        - Security
    project: src/agent-framework-egress-control-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-egress-control-responses
    displayName: Egress control test agent (Agent Framework, Responses)
    description: An Agent Framework agent for testing managed egress proxy policies on Foundry hosted agents. The agent accepts text commands and makes outbound HTTP requests through the egress proxy, returning status, headers, and body — enabling validation of Allow, Deny, Transform, and Rewrite rules defined via RAI egress policies.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # Optional: relax TLS verification for outbound requests when testing
      # through a TLS-intercepting egress proxy ("Full inspection" mode).
      # Defaults to verification enabled; set to "false" to relax.
      EGRESS_TEST_VERIFY_TLS: ${EGRESS_TEST_VERIFY_TLS}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
    # The egress layer provisions this policy after the Foundry layer and exposes
    # its resource ID to the agent deployment.
    policies:
      - type: rai_policy
        raiPolicyName: ${RAI_POLICY_ID}
infra:
  layers:
    - provider: microsoft.foundry
      path: infra/foundry
      name: foundry
    - provider: bicep
      path: infra/egress
      name: egress
      dependsOn:
        - foundry
