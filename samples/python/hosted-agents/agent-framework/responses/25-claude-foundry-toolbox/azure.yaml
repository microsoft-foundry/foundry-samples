# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: claude-foundry-toolbox-responses
services:
  ai-project:
    host: azure.ai.project
  claude-foundry-toolbox-responses:
    host: azure.ai.agent
    metadata:
      tags: [Agent Framework, AI Agent Hosting, Claude, Anthropic, Foundry Toolbox, Responses Protocol, Streaming]
    project: src/claude-foundry-toolbox-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses: [ai-project]
    kind: hosted
    name: claude-foundry-toolbox-responses
    displayName: Claude + Foundry Toolbox (Responses)
    description: An Agent Framework agent that calls a Claude model through Foundry and uses Foundry Toolbox for web search.
    protocols: [{protocol: responses, version: 2.0.0}]
    env:
      AZURE_AI_RESOURCE_NAME: ${AZURE_AI_RESOURCE_NAME}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
