# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.34.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.19'
name: agent-framework-harness-data-processing-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4
        model:
          format: OpenAI
          name: gpt-5.4
          version: '2026-03-05'
        sku:
          name: GlobalStandard
          capacity: 10
  agent-framework-harness-data-processing-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Harness Agent
        - Data Processing
        - File Tools
        - Human-in-the-Loop
    project: src/agent-framework-harness-data-processing-responses
    language: python
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-harness-data-processing-responses
    displayName: Harness Data Processing Agent (Responses)
    description: A data-processing harness agent that analyzes files and writes approved outputs.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
