# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-foundry-memory-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
      - name: text-embedding-3-small
        model:
          format: OpenAI
          name: text-embedding-3-small
          version: '1'
        sku:
          name: GlobalStandard
          capacity: 10
  agent-framework-agent-foundry-memory-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Foundry Memory
    project: src/agent-framework-agent-foundry-memory-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-foundry-memory-responses
    description: An Agent Framework agent with persistent semantic memory backed by an Azure AI Foundry Memory Store. Uses FoundryMemoryProvider to retrieve and store memories around each model invocation, allowing the agent to remember facts about a user across sessions.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_AI_EMBEDDING_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_EMBEDDING_MODEL_DEPLOYMENT_NAME=text-embedding-3-small}
      MEMORY_STORE_NAME: ${MEMORY_STORE_NAME=agent_framework_memory}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
hooks:
  postprovision:
    posix:
      shell: sh
      run: src/agent-framework-agent-foundry-memory-responses/hooks/postprovision.sh
      interactive: true
    windows:
      shell: pwsh
      run: src/agent-framework-agent-foundry-memory-responses/hooks/postprovision.ps1
      interactive: true
infra:
  provider: microsoft.foundry
