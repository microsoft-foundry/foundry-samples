# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-custom-store-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent-framework-agent-custom-store-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Custom Store
        - Redis
        - Azure Managed Redis
    project: src/agent-framework-agent-custom-store-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-custom-store-responses
    displayName: Custom Store Agent
    description: An Agent Framework Responses agent that replaces all four hosting storage extension points (responses, agent sessions, workflow checkpoints, and function approvals) with Redis-backed implementations that isolate data per user. Local development uses a Docker Redis; deployment provisions Azure Managed Redis through a layered Bicep stage.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # The redis layer provisions Azure Managed Redis and exports its host and
      # port. The postdeploy hook grants the hosted agent identity data access
      # for passwordless authentication through DefaultAzureCredential.
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_RESPONSE_TTL_SECONDS: ${REDIS_RESPONSE_TTL_SECONDS=86400}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: hooks/Set-RedisAgentAccess.ps1
    posix:
      shell: sh
      run: hooks/postdeploy.sh
infra:
  layers:
    - provider: microsoft.foundry
      path: infra/foundry
      name: foundry
    - provider: bicep
      path: infra/redis
      name: redis
      dependsOn:
        - foundry
