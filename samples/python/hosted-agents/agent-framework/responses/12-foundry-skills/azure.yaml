# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.34.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.19'
    azure.ai.skills: '>=1.0.0-beta.1'
name: agent-framework-agent-foundry-skills-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  support-style:
    host: azure.ai.skill
    uses:
      - ai-project
    archive: src/agent-framework-agent-foundry-skills-responses/skills/support-style
  escalation-policy:
    host: azure.ai.skill
    uses:
      - ai-project
    archive: src/agent-framework-agent-foundry-skills-responses/skills/escalation-policy
  agent-framework-agent-foundry-skills-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Foundry Skills
    project: src/agent-framework-agent-foundry-skills-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
      - support-style
      - escalation-policy
    kind: hosted
    name: agent-framework-agent-foundry-skills-responses
    description: An Agent Framework agent that downloads its instructions from the Foundry Skills REST API at startup, demonstrating how to decouple behavioral guidelines (tone, escalation policy, etc.) from agent code.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      SKILL_NAMES: ${SKILL_NAMES=support-style,escalation-policy}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
