# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: foreground-background-agents-voicelive
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  foreground-background-agents-voicelive:
    host: azure.ai.agent
    metadata:
      tags:
        - Foreground + Background Agents
        - Voice Optimized
        - voice_conversation_engine
    project: src/foreground-background-agents-voicelive
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: foreground-background-agents-voicelive
    displayName: Foreground + Background Conversation Engine
    description: |-
      Voice Live conversation engine with a foreground Router and background Worker.
      Uses mock site, Work IQ, document, and repair-procedure tools.
    protocols:
      - protocol: voice_conversation_engine
        version: 1.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  foreground-background-agents-voicelive-voice:
    host: azure.ai.agent
    kind: voice
    name: foreground-background-agents-voicelive-voice
    uses:
      - ai-project
      - foreground-background-agents-voicelive
    conversationEngine:
      type: hosted_agent
      name: foreground-background-agents-voicelive
    store: false
    audio:
      input:
        format:
          type: audio/pcm
          rate: 24000
        turnDetection:
          type: server_vad
          threshold: 0.5
          prefixPaddingMs: 300
          silenceDurationMs: 500
        transcription:
          model: azure-speech
      output:
        format:
          type: audio/pcm
          rate: 24000
        voice:
          type: azure-standard
          name: en-US-AvaNeural
    outputModalities:
      - audio
infra:
  provider: microsoft.foundry
