name: Foreground + Background Agents — Conversation Engine
description: CE transport migration of the existing foreground/background Responses sample.
build: >-
  cd src/foreground-background-agents-ce &&
  uv sync --frozen --python 3.13
validate: >-
  cd src/foreground-background-agents-ce &&
  uv run --frozen python -m compileall -q . &&
  uv run --frozen python -c "import azure.ai.agentserver.invocations.voice" &&
  uv run --frozen python -m ruff check .
test: >-
  cd src/foreground-background-agents-ce &&
  uv run --frozen python -m pytest -q
