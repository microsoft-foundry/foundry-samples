[project]
name = "foreground-background-agents-ce"
version = "0.1.0"
description = "CE transport migration of the foreground/background Responses sample."
requires-python = ">=3.13"
dependencies = [
    "azure-ai-agentserver-core==2.3.0b2",
    "azure-ai-agentserver-invocations==1.3.0b1",
    "azure-ai-projects==2.0.1",
    "azure-identity==1.25.3",
    "debugpy==1.8.21",
    "httpx==0.28.1",
    "openai==2.54.0",
    "opentelemetry-api==1.43.0",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
    "websockets==17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Preserve these original sample modules verbatim; ignore only inherited formatting.
"agent_logic.py" = ["E501", "E402", "I001"]
"router_agent.py" = ["E501", "I001"]
"worker_agent.py" = ["E501", "I001"]
"task_store.py" = ["I001"]
