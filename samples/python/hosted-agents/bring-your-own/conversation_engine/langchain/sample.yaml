name: Voice Live Bridge LangChain Python
description: A tool-using LangChain hosted text agent implementing Voice Live Bridge Protocol 1.0.

build: >-
  cd src/voice-live-bridge-langchain-python &&
  uv sync --frozen --python 3.13
validate: >-
  cd src/voice-live-bridge-langchain-python &&
  uv run --frozen python -m compileall -q . &&
  uv run --frozen python -c "import azure.ai.agentserver.invocations.voice" &&
  uv run --frozen python -m ruff check .
test: >-
  cd src/voice-live-bridge-langchain-python &&
  uv run --frozen python -m pytest -q
