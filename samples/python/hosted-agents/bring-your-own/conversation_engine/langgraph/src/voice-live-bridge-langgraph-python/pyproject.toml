[project]
name = "voice-live-bridge-langgraph-python"
version = "0.1.0"
description = "A model-free Microsoft Foundry conversation engine sample."
requires-python = ">=3.13"
dependencies = [
    "azure-ai-agentserver-core==2.3.0b2",
    "azure-ai-agentserver-invocations==1.3.0b1",
    "opentelemetry-api==1.43.0",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
    "websockets==17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
