# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: a2a-travel-web-search
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 100
  flights:
    host: azure.ai.agent
    project: src/flight-agent
    language: python
    kind: hosted
    name: travel-web-flights
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Copilot SDK Flight Agent researches public flights through Toolbox web search, returning citations and unverified fare and refundability warnings.
      version: 1.0.0
      skills:
        - id: flights
          name: Flight Agent
          description: Send route, travel dates, arrival deadline, traveler count, budget and refundability for cited flight research, not a guaranteed live quote.
          tags: [web-travel-research, flights]
    env:
      PYTHONNOUSERSITE: '1'
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  hotels:
    host: azure.ai.agent
    project: src/hotel-agent
    language: python
    kind: hosted
    name: travel-web-hotels
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Copilot SDK Hotel Agent researches public hotels through Toolbox web search, returning citations and unverified rate, distance and cancellation warnings.
      version: 1.0.0
      skills:
        - id: hotels
          name: Hotel Agent
          description: Send destination, stay dates, travelers, budget, refundability and a public office landmark for cited hotel research.
          tags: [web-travel-research, hotels]
    env:
      PYTHONNOUSERSITE: '1'
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  planner:
    host: azure.ai.agent
    project: src/travel-agent
    language: python
    kind: hosted
    name: travel-web-planner
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Copilot SDK Travel Planner discovers A2A specialists and saves cited, unverified trip research in user-isolated versioned storage.
      version: 1.0.0
      skills:
        - id: planner
          name: Travel Planner
          description: Research and revise saved trips by plan ID through native A2A specialists. Web results are not verified fares or availability.
          tags: [web-travel-research, a2a]
    env:
      PYTHONNOUSERSITE: '1'
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      FLIGHT_AGENT_ENDPOINT: ${FLIGHT_AGENT_ENDPOINT}
      HOTEL_AGENT_ENDPOINT: ${HOTEL_AGENT_ENDPOINT}
      TRAVEL_PLAN_STORE_NAME: travel-web-research
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
infra:
  provider: microsoft.foundry
