# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: report-a2a
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
services:
  ai-project:
    host: azure.ai.project
  report-a2a:
    host: azure.ai.agent
    project: src/report-a2a
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses: [ai-project]
    kind: hosted
    name: report-a2a
    displayName: A2A Report Writer
    description: Deterministic report Tasks with polling and cooperative cancellation.
    protocols:
      - protocol: a2a
        version: 1.0.0
    env:
      PYTHONNOUSERSITE: '1'
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Returns a Task immediately while preparing a report.
      version: 1.0.0
      skills:
        - id: report
          name: Report
          description: Prepare a report from the supplied text.
          tags: [tasks]
          examples: [quarterly results]
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
