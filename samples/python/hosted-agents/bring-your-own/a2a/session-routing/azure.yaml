# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: a2a-session-routing
infra:
  provider: microsoft.foundry
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  session-routing-c:
    name: session-routing-c
    host: azure.ai.agent
    kind: hosted
    language: python
    project: src/agent
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: bundled
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    agentEndpoint:
      protocols: [a2a]
    protocols:
      - protocol: a2a
        version: 1.0.0
    env:
      REPRO_ROLE: C
      PYTHONNOUSERSITE: "1"
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    uses: [ai-project]
  session-routing-a:
    name: session-routing-a
    host: azure.ai.agent
    kind: hosted
    language: python
    project: src/agent
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: bundled
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    agentEndpoint:
      protocols: [a2a]
    protocols:
      - protocol: a2a
        version: 1.0.0
    env:
      REPRO_ROLE: A
      C_AGENT_ENDPOINT: ${C_AGENT_ENDPOINT}
      PYTHONNOUSERSITE: "1"
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    uses: [ai-project]
  session-routing-b:
    name: session-routing-b
    host: azure.ai.agent
    kind: hosted
    language: python
    project: src/agent
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: bundled
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    agentEndpoint:
      protocols: [a2a]
    protocols:
      - protocol: a2a
        version: 1.0.0
    env:
      REPRO_ROLE: B
      C_AGENT_ENDPOINT: ${C_AGENT_ENDPOINT}
      PYTHONNOUSERSITE: "1"
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    uses: [ai-project]
