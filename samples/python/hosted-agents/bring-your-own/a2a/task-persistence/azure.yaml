# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: persistent-a2a
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
services:
  ai-project:
    host: azure.ai.project
  persistent-a2a:
    host: azure.ai.agent
    project: src/persistent-a2a
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses: [ai-project]
    kind: hosted
    name: persistent-a2a
    displayName: A2A Persistent Tasks
    description: Store and retrieve complete native A2A Task snapshots.
    protocols:
      - protocol: a2a
        version: 1.0.0
    env:
      PYTHONNOUSERSITE: '1'
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Saves Task status, history and artifacts for later retrieval.
      version: 1.0.0
      skills:
        - id: persist
          name: Persist
          description: Save a Task that can be retrieved later.
          tags: [storage]
          examples: [remember this result]
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
