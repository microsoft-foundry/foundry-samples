# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: a2a-travel
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
  flights:
    host: azure.ai.agent
    project: src/flight-agent
    language: python
    kind: hosted
    name: travel-flights
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Copilot SDK Flight Agent reasons over dummy flights and calculates trip prices.
      version: 1.0.0
      skills:
        - id: flights
          name: Flight Agent
          description: Send a complete flight request with route, dates, arrival deadline, traveler count and refundability.
          tags: [synthetic-travel, flights]
    env:
      PYTHONNOUSERSITE: '1'
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  hotels:
    host: azure.ai.agent
    project: src/hotel-agent
    language: python
    kind: hosted
    name: travel-hotels
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Copilot SDK Hotel Agent reasons over dummy hotels and calculates nights, rooms and fees.
      version: 1.0.0
      skills:
        - id: hotels
          name: Hotel Agent
          description: Send a complete hotel request with destination, stay dates, traveler count, office distance and refundability.
          tags: [synthetic-travel, hotels]
    env:
      PYTHONNOUSERSITE: '1'
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  planner:
    host: azure.ai.agent
    project: src/travel-agent
    language: python
    kind: hosted
    name: travel-planner
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Copilot SDK Travel Planner discovers Flight and Hotel Agent Cards and calls their native A2A interfaces directly.
      version: 1.0.0
      skills:
        - id: planner
          name: Travel Planner
          description: Ask both specialists over native A2A and reason about the itinerary and budget.
          tags: [synthetic-travel, a2a]
    env:
      PYTHONNOUSERSITE: '1'
      FLIGHT_AGENT_ENDPOINT: ${FLIGHT_AGENT_ENDPOINT}
      HOTEL_AGENT_ENDPOINT: ${HOTEL_AGENT_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
infra:
  provider: microsoft.foundry
