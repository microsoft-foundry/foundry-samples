# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: a2a-toolbox-travel
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
  flights:
    host: azure.ai.agent
    project: src/travel-a2a
    language: python
    kind: hosted
    name: travel-flights
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Flight Agent queries a synthetic round-trip inventory. Input is a JSON query encoded as text.
      version: 1.0.0
      skills:
        - id: flights
          name: Flight Agent
          description: 'JSON fields: origin, destination, departure_date, return_date, arrive_by (timezone ISO timestamp), travelers (integer), refundable (boolean).'
          tags: [synthetic-travel, flights]
    env:
      PYTHONNOUSERSITE: '1'
      AGENT_ROLE: flights
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  hotels:
    host: azure.ai.agent
    project: src/travel-a2a
    language: python
    kind: hosted
    name: travel-hotels
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Hotel Agent queries a synthetic stay inventory. Input is a JSON query encoded as text.
      version: 1.0.0
      skills:
        - id: hotels
          name: Hotel Agent
          description: 'JSON fields: destination, check_in, check_out, travelers (integer), refundable (boolean), max_office_distance_meters (integer).'
          tags: [synthetic-travel, hotels]
    env:
      PYTHONNOUSERSITE: '1'
      AGENT_ROLE: hotels
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  planner:
    host: azure.ai.agent
    project: src/travel-a2a
    language: python
    kind: hosted
    name: travel-planner
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Travel Planner discovers Flight and Hotel A2A tools through a managed Foundry Toolbox.
      version: 1.0.0
      skills:
        - id: planner
          name: Travel Planner
          description: Build an eligible synthetic itinerary using managed Toolbox flight and hotel results.
          tags: [synthetic-travel, toolbox]
    env:
      PYTHONNOUSERSITE: '1'
      AGENT_ROLE: planner
      TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
infra:
  provider: microsoft.foundry
