# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: a2a-support-case
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
  support:
    host: azure.ai.agent
    project: src/support-case-agent
    language: python
    kind: hosted
    name: support-case-agent
    uses: [ai-project]
    codeConfiguration: {runtime: python_3_13, entryPoint: main.py}
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Copilot SDK support-case agent with persistent case history in Foundry state storage.
      version: 1.0.0
      skills:
        - id: support-cases
          name: Support case workspace
          description: Open cases, append findings, retrieve saved history and generate stored resolution summaries.
          tags: [support, state-store, copilot]
    env:
      PYTHONNOUSERSITE: '1'
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      CASE_STORE_NAME: support-cases
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
infra:
  provider: microsoft.foundry
