# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.35.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18'
name: openclaw-incident-brief
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  openclaw-incident-brief:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Invocations Protocol
        - OpenClaw
        - Resilient Tasks
        - Python
    project: src/incident-brief
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: openclaw-incident-brief
    displayName: OpenClaw incident brief
    description: A resilient incident-briefing worker for an OpenClaw assistant.
    protocols:
      - protocol: invocations
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
