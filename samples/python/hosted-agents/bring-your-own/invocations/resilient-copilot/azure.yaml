# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: resilient-copilot
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  resilient-copilot:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - GitHub Copilot SDK
        - Invocations Protocol
        - Bring Your Own
        - Long-Running
        - Resilient Tasks
        - Crash Recovery
        - Steering
        - Human-in-the-Loop
        - Streaming
        - Python
    project: src/resilient-copilot
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: resilient-copilot
    displayName: Resilient Copilot (Invocations)
    description: A long-running, crash-resilient agent that uses the GitHub Copilot SDK as the agent brain, supervised by the resilient @multi_turn_task primitive from azure-ai-agentserver-core. The task keeps a durable Copilot session alive with no client traffic, resumes it after a container crash (resume_session on recovered re-entry), and streams every session event over a file-backed SSE stream that reconnects with no gap. Copilot's native controls drive steering (send immediate), queueing (send enqueue), and human-in-the-loop (elicitation).
    protocols:
      - protocol: invocations
        version: 2.0.0
    env:
      # LLM backend selection (see README "Environment Variables"). Default = BYOK Foundry
      # model via AZURE_AI_MODEL_DEPLOYMENT_NAME. To use the GitHub Copilot model instead,
      # comment out AZURE_AI_MODEL_DEPLOYMENT_NAME and uncomment GITHUB_TOKEN (set it to a
      # fine-grained PAT with "Copilot Requests: Read-only"; do not set both — the agent prefers Foundry).
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # GITHUB_TOKEN: ${GITHUB_TOKEN}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
