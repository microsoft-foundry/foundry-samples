# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: env-vars-agent-responses-python
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  dummy-api-key:
    host: azure.ai.connection
    uses:
      - ai-project
    category: ApiKey
    target: https://example.com
    authType: ApiKey
    credentials:
      type: ApiKey
      key: foundry-samples-dummy-api-key
  dummy-custom-keys:
    host: azure.ai.connection
    uses:
      - ai-project
    category: CustomKeys
    target: https://example.com
    authType: CustomKeys
    credentials:
      type: CustomKeys
      keys:
        secret-key: foundry-samples-dummy-secret-key
    metadata:
      plain-key: foundry-samples-dummy-plain-value
  env-vars-agent-responses-python:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - Function Calling
        - Connection Resolution
        - Python
    project: src/env-vars-agent-responses-python
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
      - dummy-api-key
      - dummy-custom-keys
    kind: hosted
    name: env-vars-agent-responses-python
    displayName: Env Vars Agent (Python, Responses)
    description: |-
      A hosted agent that returns environment variables injected by Foundry's
      connection-templated secret resolver. Demonstrates all four corners of
      the connection grid (ApiKey x CustomKeys, secret x non-secret) and a
      kind-aware safety policy in the agent: metadata and target values are
      returned verbatim; credentials are returned only as a safe fingerprint.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      SECRET_API_KEY: $${{connections.dummy-api-key.credentials.key}}
      TARGET: $${{connections.dummy-api-key.target}}
      SECRET_KEY: $${{connections.dummy-custom-keys.credentials.secret-key}}
      NON_SECRET_KEY: $${{connections.dummy-custom-keys.metadata.plain-key}}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
