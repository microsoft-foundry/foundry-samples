# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: strands-agents
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  strands-agents:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Strands Agents
        - MCP
        - Multi-Agent
        - Responses Protocol
        - Bring Your Own
    project: src/strands-agents
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: strands-agents
    displayName: Strands Agents (Responses)
    description: An AWS-to-Azure migration assistant built with the Strands Agents SDK. A Strands orchestrator calls a specialist Strands agent through agents-as-tools and grounds answers with the Microsoft Learn MCP server, running on a Foundry model with Microsoft Entra ID auth and platform-managed multi-turn history.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
