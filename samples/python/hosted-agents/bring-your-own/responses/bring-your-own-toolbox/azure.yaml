# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'
    azure.ai.toolboxes: '>=1.0.0-beta.8'
name: toolbox-python-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  my-toolbox:
    host: azure.ai.toolbox
    uses:
      - ai-project
    description: Web search and Microsoft Learn behind one endpoint
    tools:
      - type: web_search
        name: web_search
        description: Search the public web for current information.
      - type: mcp
        name: mslearn
        server_label: mslearn
        server_url: https://learn.microsoft.com/api/mcp
        require_approval: never
  toolbox-python-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - Toolbox
        - Python
    project: src/toolbox-python-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
      - my-toolbox
    kind: hosted
    name: toolbox-python-responses
    displayName: Toolbox (Python, Responses)
    description: Bring-your-own agent using the Responses protocol with Foundry Toolbox MCP integration. Connects to a toolbox at startup, discovers tools, and lets the model call them during conversation.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      TOOLBOX_ENDPOINT: ${TOOLBOX_MY_TOOLBOX_MCP_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
