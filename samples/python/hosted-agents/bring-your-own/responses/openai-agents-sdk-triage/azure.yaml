# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: openai-agents-sdk-triage
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  openai-agents-sdk-triage:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - OpenAI Agents SDK
        - MCP
        - Multi-Agent
        - Responses Protocol
        - Bring Your Own
    project: src/openai-agents-sdk-triage
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: openai-agents-sdk-triage
    displayName: OpenAI Agents SDK Support Triage
    description: A fictional support desk using OpenAI Agents SDK handoffs and a read-only MCP case and knowledge base on Microsoft Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
