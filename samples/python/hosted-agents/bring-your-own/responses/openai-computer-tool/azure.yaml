# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: openai-computer-tool-hosted
metadata:
  template: openai-computer-tool-python-byo
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4
        model:
          format: OpenAI
          name: gpt-5.4
          version: '2026-06-01'
        sku:
          name: GlobalStandard
          capacity: 10
  openai-computer-tool:
    host: azure.ai.agent
    uses:
      - ai-project
    metadata:
      tags:
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Bring Your Own
        - OpenAI Computer Tool
        - PyAutoGUI
    project: src/openai-computer-tool
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    kind: hosted
    name: openai-computer-tool
    displayName: OpenAI Computer Tool Hosted Agent (Python, Responses)
    description: A Foundry-hosted desktop automation agent using the Responses protocol, GA OpenAI Computer Tool (computer), PyAutoGUI, and Xvfb.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.4}
    container:
      resources:
        cpu: '1.0'
        memory: 2Gi
infra:
  provider: microsoft.foundry
