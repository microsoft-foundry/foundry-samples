[project]
name = "openai-computer-tool-hosted"
version = "0.1.0"
description = "A Microsoft Foundry hosted agent using the Responses protocol and GA OpenAI Computer Tool (computer) with PyAutoGUI and Xvfb."
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-responses==2.1.0",
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.25.0",
    "debugpy",
    # azure-ai-projects imports httpx directly, while OpenAI 3 uses httpx2.
    "httpx<1",
    "openai<3",
    "pillow>=11.0.0",
    "pyautogui>=0.9.54",
    "python-dotenv==1.1.1",
]
