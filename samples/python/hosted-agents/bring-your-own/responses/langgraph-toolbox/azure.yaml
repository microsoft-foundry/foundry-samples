# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: toolbox-langgraph
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  toolbox-langgraph-tools:
    host: azure.ai.toolbox
    uses:
      - ai-project
    tools:
      - type: web_search
        name: web_search
      - type: mcp
        server_label: mslearn
        server_url: https://learn.microsoft.com/api/mcp
  toolbox-langgraph:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - LangGraph
        - Toolbox
        - MCP
        - Microsoft Foundry
    project: src/toolbox-langgraph
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
      - toolbox-langgraph-tools
    kind: hosted
    name: toolbox-langgraph
    description: LangGraph agent wired for toolbox MCP in Microsoft Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: toolbox-langgraph-tools
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
