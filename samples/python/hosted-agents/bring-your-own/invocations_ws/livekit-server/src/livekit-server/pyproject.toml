[project]
name = "livekit-server"
version = "0.1.0"
description = "A Microsoft Foundry hosted agent using the Invocations WebSocket protocol."
requires-python = ">=3.12"
dependencies = [
    "debugpy",
    "fastapi>=0.115.0",
    "livekit-agents>=1.0.0,<2",
    "livekit-api>=1.0.0",
    "livekit-plugins-azure>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]
