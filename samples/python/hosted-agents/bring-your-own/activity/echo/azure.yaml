# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: echo-activity
services:
  ai-project:
    host: azure.ai.project
  echo-activity:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Activity Protocol
        - Bring Your Own
        - Python
    project: src/echo-activity
    language: python
    env:
      PYTHONNOUSERSITE: "1"
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: echo-activity
    displayName: Echo (Python, Activity)
    description: >
      Minimal echo agent using the Activity protocol with a bring-your-own
      approach. Echoes the user's message back. Uses the M365 Agents SDK for
      activity processing and outbound channel delivery, hosted by
      azure-ai-agentserver-activity for the Foundry platform contract.
    protocols:
      - protocol: activity
        version: 2.0.0
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
