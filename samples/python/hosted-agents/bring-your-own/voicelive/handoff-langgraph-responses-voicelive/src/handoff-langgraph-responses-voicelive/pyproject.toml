[project]
name = "handoff-langgraph-responses-voicelive"
version = "0.1.0"
description = "A Microsoft Foundry hosted agent for VoiceLive scenarios."
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-responses==2.1.0",
    "azure-ai-agentserver-core==2.1.0",
    "azure-ai-projects==2.0.1",
    "azure-identity==1.25.3",
    "debugpy",
    # azure-ai-projects imports httpx directly, while OpenAI 3 uses httpx2.
    "httpx[socks]>=0.28.1,<1",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "openai<3",
    "python-dotenv>=1.0.0",
]
