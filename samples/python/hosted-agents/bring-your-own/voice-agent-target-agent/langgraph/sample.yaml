name: Voice Live Bridge LangGraph Python
description: An explicit StateGraph hosted text agent implementing Voice Live Bridge Protocol 1.0.

build: >-
  cd src/voice-live-bridge-langgraph-python &&
  uv sync --frozen
validate: >-
  cd src/voice-live-bridge-langgraph-python &&
  uv run --no-sync python -m compileall -q -x '[.]venv' . &&
  uv run --no-sync python -c "import azure.ai.agentserver.invocations.voice" &&
  uv run --no-sync ruff check .
test: >-
  cd src/voice-live-bridge-langgraph-python &&
  uv run --no-sync python -m pytest -q