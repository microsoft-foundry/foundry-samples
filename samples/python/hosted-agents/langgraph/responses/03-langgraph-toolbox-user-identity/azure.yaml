# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: toolbox-langgraph-user-identity
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  langgraph-toolbox-user-identity-tools:
    host: azure.ai.toolbox
    uses:
      - ai-project
    tools:
      - type: mcp
        server_label: workiq-mail
        connection: workiq-mail-conn
        server_url: https://agent365.svc.cloud.microsoft/agents/servers/mcp_MailTools
      - type: mcp
        server_label: workiq-calendar
        connection: workiq-calendar-conn
        server_url: https://agent365.svc.cloud.microsoft/agents/servers/mcp_CalendarTools
      - type: mcp
        server_label: github
        connection: github-oauth-conn
        server_url: https://api.githubcopilot.com/mcp
  toolbox-langgraph-user-identity:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - LangGraph
        - Toolbox
        - MCP
        - OAuth2
        - User Identity
        - Microsoft Foundry
    project: src/toolbox-langgraph-user-identity
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses'
    uses:
      - ai-project
      - langgraph-toolbox-user-identity-tools
    kind: hosted
    name: toolbox-langgraph-user-identity
    displayName: LangGraph Toolbox User Identity Agent
    description: LangGraph agent with toolbox MCP tools using user identity and OAuth.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: langgraph-toolbox-user-identity-tools
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  layers:
    - provider: microsoft.foundry
      path: infra/foundry
      name: foundry
    - provider: bicep
      path: infra/connections
      name: connections
      dependsOn:
        - foundry
