# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.34.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.19'
name: custom-store
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.6-terra
        model:
          format: OpenAI
          name: gpt-5.6-terra
          version: '2026-07-09'
        sku:
          name: GlobalStandard
          capacity: 1
  custom-store:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - LangGraph
        - LangChain
        - Hybrid Deployment
        - SQLite
        - Python
    project: src/custom-store
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: custom-store
    displayName: Custom Store (Responses)
    description: 'LangGraph chat agent deployable to Foundry or on-premises with environment-specific authentication.'
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry