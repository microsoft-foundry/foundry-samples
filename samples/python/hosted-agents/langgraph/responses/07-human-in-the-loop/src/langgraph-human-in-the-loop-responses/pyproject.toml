[project]
name = "langgraph-human-in-the-loop-responses"
version = "0.1.0"
description = "A Microsoft Foundry hosted agent built with LangGraph."
requires-python = ">=3.12"
dependencies = [
    "langchain-azure-ai[hosting]>=1.2.12,<2",
    "azure-ai-projects",
    "openai<3",
    "httpx<1",
    "langchain",
    "langchain-openai",
    "python-dotenv",
    "debugpy",
]

[dependency-groups]
dev = ["ruff==0.9.4"]

[tool.hosted-agent-validation]
commands = [
    ["python", "-m", "unittest", "discover", "-s", "tests", "-v"],
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]
