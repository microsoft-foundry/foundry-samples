name: langchain-azure-branching-responses
description: >
  A checkpointed number-memory agent hosted by Foundry over the Responses
  protocol. Demonstrate branching, rewind, and regeneration by selecting
  completed responses with previous_response_id.
metadata:
  tags:
    - LangChain
    - LangGraph
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Branching
template:
  name: langchain-azure-branching-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: gpt-5.4-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME