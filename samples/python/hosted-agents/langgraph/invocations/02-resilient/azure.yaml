# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.34.2"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.19"
name: langchain-azure-resilient-invocations
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 10

  langchain-azure-resilient-invocations-steerable:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Invocations Protocol
        - LangGraph
        - LangChain
        - Long-Running
        - Resilient Tasks
        - Steering
        - Human-in-the-Loop
        - Python
    project: src/langchain-azure-resilient-invocations
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: langchain-azure-resilient-invocations-steerable
    displayName: LangGraph Resilient + Steering (Invocations)
    description: Resilient and steerable LangGraph trip-planning agent with crash simulation.
    protocols:
      - protocol: invocations
        version: 2.0.0
    env:
      STEERABLE_CONVERSATIONS: "true"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
infra:
  provider: microsoft.foundry
