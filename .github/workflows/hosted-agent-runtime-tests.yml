name: Hosted-agent runtime regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/python/hosted-agents/langgraph/responses/07-human-in-the-loop/src/**'
      - '.github/scripts/runtime-tests/test_langgraph_sample_lifecycle.py'
      - '.github/workflows/hosted-agent-runtime-tests.yml'

permissions:
  contents: read

jobs:
  hitl-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_PROJECT: samples/python/hosted-agents/langgraph/responses/07-human-in-the-loop/src/langgraph-human-in-the-loop-responses
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install runtime test resolver
        run: python -m pip install --disable-pip-version-check "uv==0.11.7"
      - name: Install frozen sample dependencies
        run: uv sync --frozen --python 3.13 --project "$RUNTIME_PROJECT"
      - name: Verify HITL revision lifecycle
        run: uv run --no-sync --project "$RUNTIME_PROJECT" python .github/scripts/runtime-tests/test_langgraph_sample_lifecycle.py
