name: Native A2A Toolbox Travel Planner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/python/hosted-agents/bring-your-own/a2a/travel-planner/**'
      - '.azure-pipelines/hosted-agent-tests/python/bring-your-own/a2a/travel-planner/**'
      - '.azure-pipelines/scripts/hosted-agents/**'
      - '.github/scripts/hosted_agent_test_spec.py'
      - '.github/scripts/check_hosted_agent_contracts.py'
      - '.github/scripts/test/test_a2a_model_harness.py'
      - '.github/workflows/a2a-travel-planner.yml'

permissions:
  contents: read

jobs:
  native-delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.7 -r .github/scripts/requirements.txt
      - name: Validate native cloud contract and harness
        run: |
          python .github/scripts/test/test_a2a_model_harness.py
          python .github/scripts/hosted_agent_test_spec.py validate \
            --spec .azure-pipelines/hosted-agent-tests/python/bring-your-own/a2a/travel-planner/test-spec.yml
          python .github/scripts/hosted_agent_test_spec.py plan --protocol a2a \
            --spec .azure-pipelines/hosted-agent-tests/python/bring-your-own/a2a/travel-planner/test-spec.yml \
            --output "$RUNNER_TEMP/travel-plan.json"
          bash -n .azure-pipelines/scripts/hosted-agents/discover-samples.sh
          bash -n .azure-pipelines/scripts/hosted-agents/run-hosted-agent.sh
      - name: Test native HTTP workers and Toolbox planner failure contracts
        run: |
          uv run --frozen --python "${{ matrix.python }}" \
            --project samples/python/hosted-agents/bring-your-own/a2a/travel-planner/src/travel-a2a \
            python -m unittest discover \
            -s samples/python/hosted-agents/bring-your-own/a2a/travel-planner/tests -p 'test_*.py' -v
