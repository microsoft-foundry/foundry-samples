name: Native A2A samples

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/python/hosted-agents/bring-your-own/a2a/**'
      - '.azure-pipelines/hosted-agent-tests/python/bring-your-own/a2a/**'
      - '.azure-pipelines/scripts/hosted-agents/**'
      - '.github/scripts/hosted_agent_test_spec.py'
      - '.github/scripts/check_hosted_agent_contracts.py'
      - '.github/scripts/test/test_a2a_samples.py'
      - '.github/workflows/a2a-samples.yml'

permissions:
  contents: read

jobs:
  protocol-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - name: Validate native A2A harness and contracts
        run: python .github/scripts/test/test_a2a_samples.py
      - name: Check shell syntax
        run: |
          bash -n .azure-pipelines/scripts/hosted-agents/discover-samples.sh
          bash -n .azure-pipelines/scripts/hosted-agents/run-hosted-agent.sh

  sample-http-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.7
      - name: Test automatic setup, HTTP, cancellation and cross-process persistence
        run: |
          uv run --frozen --python "${{ matrix.python }}" \
            --project samples/python/hosted-agents/bring-your-own/a2a/echo/src/echo-a2a \
            python -m unittest discover -s samples/python/hosted-agents/bring-your-own/a2a/tests -p 'test_*.py' -v
