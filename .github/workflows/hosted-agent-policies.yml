name: Hosted-agent policies

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: hosted-agent-policies-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Hosted-agent contract policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install policy dependencies
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: Test contract policy and workflow
        run: |
          python .github/scripts/test/test_check_hosted_agent_contracts.py
          python .github/scripts/test/test_hosted_agent_fixture.py
          python .github/scripts/test/test_hosted_agent_test_spec.py
          python .github/scripts/test/test_hosted_agent_policies_workflow.py
      - name: Check new hosted-agent contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" HEAD)"
          python .github/scripts/check_hosted_agent_contracts.py --base "$base" --head HEAD

  dependencies:
    name: Python hosted-agent dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install policy dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pip==25.1.1" "uv==0.11.7" -r .github/scripts/requirements.txt
      - name: Test dependency policy
        run: python .github/scripts/test/test_check_hosted_agent_python_requirements.py
      - name: Check changed Python runtime dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_URL: https://github.com/microsoft-foundry/foundry-samples/blob/main/samples/python/hosted-agents/DEPENDENCY_POLICY.md
        run: |
          base="$(git merge-base "$BASE_SHA" HEAD)"
          python .github/scripts/check-hosted-agent-python-requirements.py \
            --base "$base" --head HEAD --resolve --policy-url "$POLICY_URL"

  runtimes:
    name: Python hosted-agent runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install runtime-check tooling
        run: >-
          python -m pip install --disable-pip-version-check
          "uv==0.11.7" -r .github/scripts/requirements.txt
      - name: Test generic runtime validation
        run: python .github/scripts/test/test_hosted_agent_runtime.py
      - name: Run changed hosted-runtime regressions and lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" HEAD)"
          python .github/scripts/check_hosted_agent_runtime.py --base "$base" --head HEAD
